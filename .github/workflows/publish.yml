name: publish

# Replaced in the fork with the Tegami publish path. The upstream vercel-labs
# manual dispatch workflow (maintainer GPG signing + npm publish) is not used.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: validate the publish lock without publishing
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.head.ref == 'tegami/version-packages' ||
        contains(github.event.pull_request.labels.*.name, 'release')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: version and publish
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: pnpm run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: validate publish lock (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: pnpm run tegami publish --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
